name: Deploy MERSAL Customer Web to Firebase Hosting

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack project
        run: unzip -q mersal_customer.zip -d src

      - name: Generate web scaffold
        run: flutter create --org com.mersal --project-name customer --platforms web app

      - name: Apply our code
        run: |
          rm -rf app/lib app/test
          cp -r src/lib app/lib
          cp src/pubspec.yaml app/pubspec.yaml
          if [ -d src/assets ]; then rm -rf app/assets; cp -r src/assets app/assets; fi

      - name: Build web release
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release

      - name: Write Firebase Hosting config
        run: |
          printf '%s' '{"hosting":[{"target":"app","public":"app/build/web","ignore":["firebase.json","**/.*"],"rewrites":[{"source":"**","destination":"/index.html"}]}]}' > firebase.json
          printf '%s' '{"projects":{"default":"mersal-delivery-2687a"},"targets":{"mersal-delivery-2687a":{"hosting":{"app":["mersalapp"]}}}}' > .firebaserc

      - name: Deploy to mersalapp (live)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MERSAL }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting:app --project mersal-delivery-2687a --non-interactive
