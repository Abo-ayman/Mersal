name: Deploy MERSAL Customer Web to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'preview (test link) or live (public site)'
        required: true
        default: preview
        type: choice
        options: [preview, live]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack project
        run: unzip -q mersal_customer.zip -d src

      - name: Generate web scaffold
        run: flutter create --org com.mersal --project-name customer --platforms web app

      - name: Apply our code
        run: |
          rm -rf app/lib app/test
          cp -r src/lib app/lib
          cp src/pubspec.yaml app/pubspec.yaml
          if [ -d src/assets ]; then rm -rf app/assets; cp -r src/assets app/assets; fi

      - name: Build web release
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release

      - name: Write Firebase Hosting config
        run: |
          printf '%s' '{"hosting":{"public":"app/build/web","ignore":["firebase.json","**/.*"],"rewrites":[{"source":"**","destination":"/index.html"}]}}' > firebase.json
          printf '%s' '{"projects":{"default":"mersal-delivery-2687a"}}' > .firebaserc

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MERSAL }}
          channelId: ${{ inputs.channel }}
          projectId: mersal-delivery-2687a
